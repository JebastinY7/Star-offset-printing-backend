{% extends 'base.html' %}

{% block content %}

<div class="addx-page">

  <!-- HEADER -->
  <div class="addx-header">
    <h1>Edit Order</h1>
  </div>

  <!-- FORM -->
  <div class="order-form-card addx-form-card">

    <form method="POST">

      {% csrf_token %}

      <!-- TOP DETAILS -->
      <div class="form-grid addx-form-grid">

        <!-- CUSTOMER -->
        <div class="form-group addx-form-group">
          <label>Customer</label>

          <select name="customer_id" id="customerSelect" required>
            <option value="">Select Customer</option>

            {% for customer in customers %}
            <option value="{{ customer.id }}"
            {% if customer.id == order.customer.id %}selected{% endif %}>
              {{ customer.name }} - {{ customer.phone }}
            </option>
            {% endfor %}
          </select>
        </div>
        
        
        <div class="form-group addx-form-group">
          <label>Work Name</label>
          <input type="text"
                name="work_name"
                value="{{ order.work_name }}"
                placeholder="e.g. Visiting Card, Wedding Notice" required>
        </div>
        </div>

        <div class="addx-form-grids">
        <div class="form-group addx-form-group">
          <label>Status</label>

          <select name="status">
            <option value="pending"
            {% if order.status == 'pending' %}selected{% endif %}>Pending</option>
            <option value="progress"
            {% if order.status == 'progress' %}selected{% endif %}>In Progress</option>
            <option value="completed"
            {% if order.status == 'completed' %}selected{% endif %}>Completed</option>
            <option value="delivered"
            {% if order.status == 'delivered' %}selected{% endif %}>Delivered</option>
          </select>
        </div>

        <!-- ORDER DATE -->
        <div class="form-group addx-form-group">
          <label>Order Date</label>

          <input type="date"
                 name="order_date"
                 id="orderDate"
                 value="{{ order.order_date|date:'Y-m-d' }}"
                 required>
        </div>

        <!-- DELIVERY DATE -->
        <div class="form-group addx-form-group">
          <label>Delivery Date</label>

          <input type="date"
                 name="delivery_date"
                 id="deliveryDate"
                 value="{{ order.delivery_date|date:'Y-m-d' }}">
        </div>
      </div>
      


      <!-- ITEM SECTION -->
      <div class="order-items-card">

    <h2>Items</h2>

    <div class="items-grid edit">

        <div><h5>Select Billing Type</h5>
        <!-- BILLING TYPE -->
        <select id="billingMode">

            <option value="normal">
                Normal Print
            </option>

            <option value="digital">
                Digital Print
            </option>

        </select></div>

        <!-- CUSTOMER TYPE -->
        <div id="customerTypeWrapper" style="display:none;">

            <h5>Customer Type</h5>
            <select id="customerType">

                <option value="customer">
                    Customer
                </option>

                <option value="shop">
                    Shop
                </option>

            </select>

        </div>

    </div>


    <!-- NORMAL PRINT -->
    <div id="normalFields" class="top-grid">

        <select id="itemCategory">
            <option value="">Select Category</option>

            {% for cat in categories %}
            <option value="{{ cat.id }}">
                {{ cat.name }}
            </option>
            {% endfor %}
        </select>

        <select id="itemSize">
            <option value="">Select Size</option>
        </select>

        <select id="itemVariant">
            <option value="">Select Variant</option>
        </select>

        <input type="number"
               id="itemQty"
               placeholder="Qty"
               min="1">

        <input type="number"
            id="itemJob"
            placeholder="Job"
            value="1"
            min="1">

    </div>


    <!-- DIGITAL PRINT -->
    <div id="digitalFields"
         class="digital-grid"
         style="display:none;">

        <select id="digitalCategory">

            <option value="">
                Select Category
            </option>

            {% for cat in digital_categories %}
            <option value="{{ cat.id }}">
                {{ cat.name }}
            </option>
            {% endfor %}

        </select>

        <select id="digitalGsm">
            <option value="">
                Select GSM
            </option>
        </select>

        <select id="digitalProduct">
            <option value="">
                Select Product
            </option>
        </select>

        <select id="digitalLamination">
            <option value="">
                Select Lamination
            </option>
        </select>

        <select id="digitalSize">
            <option value="">
                Select Side
            </option>

            <option value="single">
                Single Side
            </option>

            <option value="double">
                Double Side
            </option>
        </select>

        

        <select id="digitalDeliveryType">

            {% for delivery in delivery_types %}

            <option value="{{ delivery.id }}">
                {{ delivery.name }}
            </option>

            {% endfor %}

        </select>

        <input type="number"
               id="digitalQty"
               placeholder="Qty"
               min="1">

        <input type="number"
       id="digitalJob"
       placeholder="Job"
       value="1"
       min="1">

    </div>


    <!-- PRICE ROW -->
    <div class="bottom-grid">

        <input type="text"
               id="itemPrice"
               placeholder="Price"
               readonly>

        <input type="text"
               id="itemTotal"
               placeholder="Total"
               readonly>

        <button type="button"
                class="add-item-btn"
                onclick="addOrderItem()">

            Add
        </button>

    </div>

</div>


        <!-- TABLE -->
        <table class="order-items-table">

          <thead>
            <tr>
              <th>Item</th>
              <th>Qty</th>
              <th>Job</th>
              <th>Price</th>
              <th>Total</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="orderItemsBody">

            </tbody>

        </table>

      </div>


      <!-- PAYMENT SUMMARY -->
      <div class="payment-summary-card">

        <div class="summary-grid">

          <!-- GROSS -->
          <div class="form-group addx-form-group">
            <label>Gross Total</label>

            <input type="text"
                   id="grossTotal"
                   name="total_amount"
                   readonly
                   value="{{ order.total_amount }}">
          </div>

          <!-- ADVANCE -->
          <div class="form-group addx-form-group">
            <label>Advance Paid</label>

            <input type="number"
                   step="0.01"
                   id="advancePaid"
                   name="advance_paid"
                   value="{{ order.advance_paid }}"
                   oninput="calculateDue()">
          </div>

          <!-- DUE -->
          <div class="form-group addx-form-group">
            <label>Due Amount</label>

            <input type="text"
                   id="dueAmount"
                   readonly
                   value="{{ order.due_amount }}">
          </div>
          <!-- NOTES -->
        <div class="form-group addx-form-group addx-full">
          <label>Description / Notes</label>

          <textarea name="notes"
            placeholder="Paper type, urgent work, design notes, printing details...">{{ order.notes }}</textarea>
        </div>

        </div>

      </div>


      <!-- SAVE -->
      <div class="addx-btn-row">

        <button type="submit"
                class="addx-save-btn">

          Save Order
        </button>

        <a href="{% url 'orders_page' %}"
           class="addx-cancel-btn">

          Cancel
        </a>

      </div>

    </form>

  </div>

</div>


<script>

window.existingOrderItems = [

{% for item in order.items.all %}
{
    billing_type: "{{ item.billing_type|default:'normal' }}",

    customer_type: "{{ item.customer_type|default:'customer' }}",

    delivery_type: "{{ item.delivery_type_id|default:'' }}",

    category_id: "{{ item.category_id|default:item.digital_category_id|default:'' }}",

    category: "{% if item.category %}{{ item.category.name|escapejs }}{% elif item.digital_category %}{{ item.digital_category.name|escapejs }}{% endif %}",

    size_id: "{{ item.size_id|default:item.digital_gsm_id|default:'' }}",

    size: "{% if item.size %}{{ item.size.name|escapejs }}{% elif item.digital_gsm %}{{ item.digital_gsm.name|escapejs }}{% endif %}",

    variant_id: "{{ item.variant_id|default:item.digital_product_id|default:'' }}",

    variant: "{% if item.variant %}{{ item.variant.name|escapejs }}{% elif item.digital_product %}{{ item.digital_product.name|escapejs }}{% endif %}",

    lamination_id: "{{ item.digital_lamination_id|default:'' }}",

    lamination: "{% if item.digital_lamination %}{{ item.digital_lamination.name|escapejs }}{% endif %}",

    side: "{{ item.side|default:'' }}",

    side_name: "{{ item.side_name|default:'' }}",

    qty: parseFloat("{{ item.qty|default:0 }}"),

    job: parseFloat("{{ item.job|default:1 }}"),

    price: parseFloat("{{ item.price|default:0 }}"),

    total: parseFloat("{{ item.total|default:0 }}")
},
{% endfor %}

];

</script>

<script>

let orderItems = [];
let editIndex = -1;
let job = 1;
let digitalJob = 1;


/* ADD ITEM */
function addOrderItem() {

    let billingMode =
    document.getElementById("billingMode").value;

    let category =
      document.getElementById("itemCategory");

    let size =
      document.getElementById("itemSize");

    let variant =
      document.getElementById("itemVariant");

    let qty =
      parseFloat(document.getElementById("itemQty").value) || 0;

    let price =
      parseFloat(document.getElementById("itemPrice").value) || 0;
    
    let total =
      parseFloat(document.getElementById("itemTotal").value) || 0;

    if (billingMode === "digital") {

    let category =
        document.getElementById("digitalCategory");

    let gsm =
        document.getElementById("digitalGsm");

    let product =
        document.getElementById("digitalProduct");

    let qty =
        parseFloat(
            document.getElementById("digitalQty").value
        ) || 0;

       let digitalJob =
  parseFloat(
    document.getElementById("digitalJob").value
  ) || 1;

    let price =
        parseFloat(
            document.getElementById("itemPrice").value
        ) || 0;

    let total =
        parseFloat(
            document.getElementById("itemTotal").value
        ) || 0;

    orderItems.push({

        billing_type: "digital",

        customer_type:
        document.getElementById("customerType").value,

    delivery_type:
        document.getElementById("digitalDeliveryType").value,

        delivery_name:
        document.getElementById("digitalDeliveryType")
        .options[
        document.getElementById("digitalDeliveryType").selectedIndex
        ].text,

        category_id: category.value,

        category:
            category.options[
                category.selectedIndex
            ].text,

        size_id: gsm.value,

        size:
            gsm.options[
                gsm.selectedIndex
            ].text,

        side:
    document.getElementById("digitalSize").value,

side_name:
    document.getElementById("digitalSize")
        .options[
            document.getElementById("digitalSize").selectedIndex
        ].text,

        variant_id: product.value,

        variant:
            product.options[
                product.selectedIndex
            ].text,
        
        lamination_id:
            digitalLamination.value,

        lamination:
            digitalLamination.options[
                digitalLamination.selectedIndex
            ].text,

        qty: qty,
        job: digitalJob,
        price: price,
        total: total
    });

    renderItems();

    return;
}

    if (!category.value || !size.value || !variant.value || qty <= 0) {
        showToast("Fill all item fields");
        return;
    }

    let itemData = {
        billing_type: "normal",
        category_id: category.value,
        category: category.options[category.selectedIndex].text,

        size_id: size.value,
        size: size.options[size.selectedIndex].text,

        variant_id: variant.value,
        variant: variant.options[variant.selectedIndex].text,

        qty: qty,
        job: job,
        price: price,
        total: total
    };

    if (document.querySelector(".add-item-btn").innerText === "Update") {

    // JUST ADD BACK UPDATED ITEM
    orderItems.push(itemData);

    document.querySelector(".add-item-btn").innerText = "Add";
}
else {

    orderItems.push(itemData);
}

    renderItems();

    clearItemFields();
}

const digitalCategory =
    document.getElementById("digitalCategory");

const digitalGsm =
    document.getElementById("digitalGsm");

const digitalProduct =
    document.getElementById("digitalProduct");

const digitalLamination =
    document.getElementById("digitalLamination");


/* LOAD GSM */
digitalCategory.addEventListener("change", function () {

    const categoryId = this.value;

    fetch(`/get-digital-gsm/?category_id=${categoryId}`)

    .then(response => response.json())

    .then(data => {

        digitalGsm.innerHTML =
            '<option value="">Select GSM</option>';

        data.gsms.forEach(gsm => {

            digitalGsm.innerHTML += `
                <option value="${gsm.id}">
                    ${gsm.name}
                </option>
            `;
        });

    });

});


/* LOAD PRODUCTS */
digitalGsm.addEventListener("change", loadDigitalProducts);

document.getElementById("digitalSize")
.addEventListener("change", loadDigitalProducts);

function loadDigitalProducts() {

    const gsmId =
        digitalGsm.value;

    const side =
        document.getElementById("digitalSize").value;

    if (!gsmId || !side) {

        digitalProduct.innerHTML =
            '<option value="">Select Product</option>';

        return;
    }

    fetch(
        `/get-digital-products/?gsm_id=${gsmId}&side=${side}`
    )

    .then(response => response.json())

    .then(data => {

        digitalProduct.innerHTML =
            '<option value="">Select Product</option>';

        data.products.forEach(product => {

            digitalProduct.innerHTML += `
                <option value="${product.id}">
                    ${product.name}
                </option>
            `;
        });

    });

}

function loadDigitalLaminations() {

    const productId = digitalProduct.value;

    if (!productId) {

        digitalLamination.innerHTML =
            '<option value="">Select Lamination</option>';

        return;
    }

    fetch(
        `/get-digital-laminations/?product_id=${productId}`
    )

    .then(response => response.json())

    .then(data => {

        digitalLamination.innerHTML =
            '<option value="">Select Lamination</option>';

        data.laminations.forEach(lamination => {

            digitalLamination.innerHTML += `
                <option value="${lamination.id}">
                    ${lamination.name}
                </option>
            `;
        });

    });
}

const digitalQty =
    document.getElementById("digitalQty");

const digitalWorkType =
    document.getElementById("digitalDeliveryType");

const customerType =
    document.getElementById("customerType");


function loadDigitalPrice() {

    const productId = digitalProduct.value;

    const qty =
        parseFloat(digitalQty.value) || 0;

    if (!productId || qty <= 0) {

        document.getElementById("itemPrice").value = "";

        document.getElementById("itemTotal").value = "";

        return;
    }

    

    const laminationId =
    document.getElementById("digitalLamination").value;

const side =
    document.getElementById("digitalSize").value;

const deliveryType =
    document.getElementById("digitalDeliveryType").value;

fetch(
`/get-digital-price/?lamination_id=${laminationId}&side=${side}&delivery_type=${deliveryType}&qty=${qty}`
)

    .then(response => response.json())

    .then(data => {

        if (!data.success) {

            document.getElementById("itemPrice").value = "";

            document.getElementById("itemTotal").value = "";

            return;
        }

        let price = 0;

/* 1 DAY = SAME RATE FOR ALL */
if (digitalWorkType.value === "one_day") {

    price = parseFloat(
        data.one_day_rate || 0
    );
}

/* NORMAL CUSTOMER */
else if (customerType.value === "customer") {

    price = parseFloat(
        data.customer_rate || 0
    );
}

/* SHOP */
else {

    price = parseFloat(
        data.shop_rate || 0
    );
}

        document.getElementById("itemPrice").value =
            price.toFixed(2);

        const digitalJob =
    parseFloat(
        document.getElementById("digitalJob").value
    ) || 1;

document.getElementById("itemTotal").value =
    (price * digitalJob).toFixed(2);

    });
}

digitalProduct.addEventListener(
    "change",
    loadDigitalPrice
);

digitalProduct.addEventListener(
    "change",
    loadDigitalLaminations
);

digitalQty.addEventListener(
    "input",
    loadDigitalPrice
);

document.getElementById("digitalJob")
.addEventListener(
    "input",
    loadDigitalPrice
);

customerType.addEventListener(
    "change",
    loadDigitalPrice
);

digitalWorkType.addEventListener(
    "change",
    loadDigitalPrice
);

digitalWorkType.addEventListener(
    "change",
    loadDigitalPrice
);


/* RENDER ITEMS */
function renderItems() {

    let tbody =
      document.getElementById("orderItemsBody");

    tbody.innerHTML = "";

    let gross = 0;

    orderItems.forEach((item, index) => {

        gross += item.total;

        tbody.innerHTML += `
        <tr>

          <td>
            ${item.category}
            -
            ${item.size}
            -
            ${item.variant}

            ${item.lamination
                ? ` - ${item.lamination}`
                : ""
            }
            
            ${(item.side_name || item.side)
                ? ` - ${item.side_name || item.side}`
                : ""
            }

            <input type="hidden" name="item_category[]" value="${item.category_id || ''}">

            <input type="hidden" name="item_size[]" value="${item.size_id || ''}">

            <input type="hidden" name="item_variant[]" value="${item.variant_id || ''}">

            <input type="hidden" name="item_qty[]" value="${item.qty}">

            <input type="hidden" name="item_price[]" value="${item.price}">

            <input type="hidden" name="item_total[]" value="${item.total}">

            <input type="hidden" name="item_category_name[]" value="${item.category}">

            <input type="hidden" name="item_size_name[]" value="${item.size}">

            <input type="hidden" name="item_variant_name[]" value="${item.variant}">

            <input type="hidden" name="item_lamination[]" value="${item.lamination_id || ''}">

            <input type="hidden" name="item_lamination_name[]" value="${item.lamination || ''}">

            <input type="hidden" name="billing_type[]" value="${item.billing_type || 'normal'}">

            <input type="hidden" name="item_side[]" value="${item.side || ''}">

            <input type="hidden" name="item_side_name[]" value="${item.side_name || ''}">

            <input type="hidden" name="item_job[]" value="${item.job || 1}">

            <input type="hidden" name="item_delivery_type[]" value="${item.delivery_type || ''}">
        </td>

          <td>${item.qty}</td>

          <td>${item.job || 1}</td>

          <td>₹${parseFloat(item.price || 0).toFixed(2)}</td>

          <td>₹${parseFloat(item.total || 0).toFixed(2)}</td>

          <td>
          <div class="action-btns">
          <div class="tooltip">
          <button type="button"
            onclick="editItem(${index})">
            ✏️
        </button>
        <span class="tooltip-text">Edit</span>
        </div>
              
              <div class="tooltip">
                <button type="button"
                    onclick="removeItem(${index})">X</button>
                    <span class="tooltip-text">Remove</span>
              </div>
           </div>
          </td>

        </tr>
        `;
    });

    document.getElementById("grossTotal").value =
      gross.toFixed(2);

    calculateDue();
}




/* REMOVE ITEM */
function removeItem(index) {

    orderItems.splice(index, 1);

    renderItems();
}


function editItem(index) {

    let item = orderItems[index];

    orderItems.splice(index, 1);

    renderItems();

    document.querySelector(".add-item-btn").innerText =
        "Update";

    /* BILLING MODE */
    const billingModeSelect =
    document.getElementById("billingMode");

billingModeSelect.value =
    item.billing_type || "normal";

billingModeSelect.dispatchEvent(
    new Event("change")
);

    /* DIGITAL PRINT */
    if (item.billing_type === "digital") {

    const categoryDropdown =
        document.getElementById("digitalCategory");

    const gsmDropdown =
        document.getElementById("digitalGsm");

    const productDropdown =
        document.getElementById("digitalProduct");
    
    const laminationDropdown =
    document.getElementById("digitalLamination");

    /* CATEGORY */

    categoryDropdown.value =
    String(item.category_id || "");

    /* LOAD GSM */

    fetch(`/get-digital-gsm/?category_id=${item.category_id}`)

    .then(res => res.json())

    .then(data => {

        gsmDropdown.innerHTML =
            '<option value="">Select GSM</option>';

        data.gsms.forEach(gsm => {

            gsmDropdown.innerHTML += `
                <option value="${gsm.id}">
                    ${gsm.name}
                </option>
            `;
        });

        /* SET GSM VALUE */
        gsmDropdown.value =
    String(item.size_id || "");

    const sideValue = item.side || "";

document.getElementById("digitalSize").value =
    sideValue;

return fetch(
    `/get-digital-products/?gsm_id=${item.size_id}&side=${sideValue}`
);
    })

    .then(res => res.json())

    .then(data => {

        productDropdown.innerHTML =
            '<option value="">Select Product</option>';

        data.products.forEach(product => {

            productDropdown.innerHTML += `
                <option value="${product.id}">
                    ${product.name}
                </option>
            `;
        });

        /* SET PRODUCT VALUE */
        productDropdown.value =
    String(item.variant_id || "");

fetch(
    `/get-digital-laminations/?product_id=${item.variant_id}`
)

.then(res => res.json())

.then(laminationData => {

    laminationDropdown.innerHTML =
        '<option value="">Select Lamination</option>';

    laminationData.laminations.forEach(lamination => {

        laminationDropdown.innerHTML += `
            <option value="${lamination.id}">
                ${lamination.name}
            </option>
        `;
    });

    laminationDropdown.value =
        String(item.lamination_id || "");

    document.getElementById("digitalDeliveryType").value =
item.delivery_type;

    document.getElementById("digitalQty").value =
        item.qty || "";

    document.getElementById("digitalJob").value =
        item.job || 1;

    document.getElementById("itemPrice").value =
        item.price || "";

    document.getElementById("itemTotal").value =
        item.total || "";
});

        /* OTHER VALUES */

document.getElementById("customerType").value =
    item.customer_type || "customer";

/* SET GSM VALUE */

    });

    return;
}

    /* NORMAL PRINT */

    document.getElementById("itemCategory").value =
        item.category_id;

    fetch(`/get-sizes/?category_id=${item.category_id}`)
    .then(response => response.json())

    .then(data => {

        const sizeSelect =
            document.getElementById("itemSize");

        sizeSelect.innerHTML =
            '<option value="">Select Size</option>';

        data.sizes.forEach(size => {

            sizeSelect.innerHTML += `
                <option value="${size.id}">
                    ${size.name}
                </option>
            `;
        });

        sizeSelect.value = item.size_id;

        return fetch(
            `/get-variants/?size_id=${item.size_id}`
        );
    })

    .then(response => response.json())

    .then(data => {

        const variantSelect =
            document.getElementById("itemVariant");

        variantSelect.innerHTML =
            '<option value="">Select Variant</option>';

        data.variants.forEach(variant => {

            variantSelect.innerHTML += `
                <option value="${variant.id}">
                    ${variant.name}
                </option>
            `;
        });

        variantSelect.value = item.variant_id;

        document.getElementById("itemQty").value =
            item.qty;
        
        document.getElementById("itemJob").value =
    item.job || 1;

        document.getElementById("itemPrice").value =
            item.price;

        document.getElementById("itemTotal").value =
            item.total;
    });
}



/* DUE */
function calculateDue() {

    let gross =
      parseFloat(document.getElementById("grossTotal").value) || 0;

    let advance =
      parseFloat(document.getElementById("advancePaid").value) || 0;

    let due = gross - advance;

    if (due < 0) {
        due = 0;
    }

    document.getElementById("dueAmount").value =
      due.toFixed(2);
}


const categorySelect = document.getElementById("itemCategory");
const sizeSelect = document.getElementById("itemSize");
const variantSelect = document.getElementById("itemVariant");

categorySelect.addEventListener("change", function () {

    const categoryId = this.value;

    fetch(`/get-sizes/?category_id=${categoryId}`)
        .then(response => response.json())
        .then(data => {
          const sizeSelect =
  document.getElementById("itemSize");

            sizeSelect.innerHTML =
                '<option value="">Select Size</option>';

            data.sizes.forEach(size => {

                sizeSelect.innerHTML += `
                    <option value="${size.id}">
                        ${size.name}
                    </option>
                `;
            });
        });

});

sizeSelect.addEventListener("change", function () {

    const sizeId = this.value;

    fetch(`/get-variants/?size_id=${sizeId}`)
        .then(response => response.json())
        .then(data => {
          const variantSelect =

/* =========================================
   BILL BOOK CUSTOM PRICE CALCULATOR
   (Category: Bill Book | Normal Print)
   Fully JS-calculated, does NOT use PriceRule table.
   Kept identical to the one used on the Billing page so
   pricing never disagrees between Orders and Billing.
========================================= */
/* =========================================
   BILL BOOK PRINT COST (Notice-style step table)
   Same breakpoint tables/behavior as the Notice category's print
   charge, but keyed on total PAPERS (books x 100) instead of pieces.
   Values come straight from the size-wise printing charge sheet.
========================================= */
/* =========================================
   BILL BOOK ROUND-OFF
   Only for Bill Book category totals.
     last digit 1-4 -> round UP to nearest 5
     last digit 6-9 -> round UP to nearest 10
     last digit 0 or 5 -> unchanged
   e.g. 422 -> 425, 426 -> 430
========================================= */
function billBookRoundOff(amount) {

    let rounded = Math.round(amount);
    let lastDigit = rounded % 10;

    if (lastDigit === 0 || lastDigit === 5) {
        return rounded;
    } else if (lastDigit >= 1 && lastDigit <= 4) {
        return rounded + (5 - lastDigit);
    } else {
        return rounded + (10 - lastDigit);
    }
}

function billBookPrintCost(totalPapers, isLegal, isA5, isA6) {

    const A4_TABLE  = [[100,150],[200,180],[300,200],[500,250],[1000,250],[2000,500],[3000,750],[4000,1000],[5000,1250],[10000,2500]];
    const A5_TABLE  = [[100,150],[200,150],[300,180],[500,200],[1000,250],[2000,250],[3000,500],[4000,500],[5000,750],[10000,1250]];
    const LGL_TABLE = [[100,180],[200,200],[300,220],[500,270],[1000,300],[2000,600],[3000,900],[4000,1200],[5000,1500],[10000,3000]];
    const A6_TABLE  = [[400,150],[600,150],[800,180],[1200,200],[1500,250],[4000,250],[6000,500],[8000,750],[12000,1000],[15000,1250],[40000,2500]];

    let table = isLegal ? LGL_TABLE : (isA5 ? A5_TABLE : (isA6 ? A6_TABLE : A4_TABLE));

    if (totalPapers <= 0) return 0;

    for (let i = 0; i < table.length; i++) {
        if (totalPapers <= table[i][0]) {
            return table[i][1];
        }
    }

    /* Beyond the last listed breakpoint: extrapolate using the slope
       between the last two breakpoints (per 1000 papers). */
    let last = table[table.length - 1];
    let prev = table[table.length - 2];
    let ratePer1000 = (last[1] - prev[1]) / ((last[0] - prev[0]) / 1000);
    let extraSteps = Math.ceil((totalPapers - last[0]) / 1000);

    return Math.round((last[1] + (extraSteps * ratePer1000)) * 100) / 100;
}

function calculateBillBookPrice(qty, job, variantText, sizeText) {

    qty = parseFloat(qty) || 0;
    job = parseFloat(job) || 1;
    variantText = (variantText || "").toLowerCase();
    sizeText = (sizeText || "").toLowerCase();

    const PAPERS_PER_BOOK = 100;

    let totalBooks = qty;
    let totalPapers = totalBooks * PAPERS_PER_BOOK;

    let isLegal = sizeText.includes("legal");
    let isA5 = sizeText.includes("a5");
    let isA6 = sizeText.includes("a6");

    let originalRate, duplicateRate, designChargeAmount;

    if (isLegal) {
        originalRate = 0.60;
        duplicateRate = 0.40;
        designChargeAmount = 200;
    } else {
        // A4 / A5 / A6 share the same material rates
        originalRate = variantText.includes("low") ? 0.35 : 0.42;
        duplicateRate = 0.30;
        designChargeAmount = 150;
    }

    let paperRate = variantText.includes("dupl")
        ? originalRate + duplicateRate   // Dupl. book = original sheet + carbon sheet
        : originalRate;                  // Original-only book = just the original sheet

    let paperCost = Math.round(totalPapers * paperRate * 100) / 100;

    /* ---- Print cost: Notice-style step table, by size ---- */
    let printCost = billBookPrintCost(totalPapers, isLegal, isA5, isA6);

    let designCharge = totalBooks > 0 ? designChargeAmount : 0;

    let bindingRate;

    if (isLegal) {
        if (totalBooks <= 10) bindingRate = 60;
        else if (totalBooks <= 30) bindingRate = 50;
        else bindingRate = 40;
    } else if (isA5) {
        if (totalBooks <= 10) bindingRate = 30;
        else if (totalBooks <= 30) bindingRate = 25;
        else bindingRate = 20;
    } else if (isA6) {
        if (totalBooks <= 10) bindingRate = 20;
        else if (totalBooks <= 30) bindingRate = 15;
        else bindingRate = 12;
    } else {
        // Default: A4
        if (totalBooks <= 10) bindingRate = 50;
        else if (totalBooks <= 30) bindingRate = 40;
        else bindingRate = 30;
    }

    let bindingCost = totalBooks * bindingRate;

    return billBookRoundOff(Math.round((paperCost + printCost + designCharge + bindingCost) * job * 100) / 100);
}

/* =========================================
   NOTICE CUSTOM PRICE CALCULATOR
   Fully JS-calculated, does NOT use PriceRule table.
   Kept identical to the one used on the Billing page so
   pricing never disagrees between Orders and Billing.
========================================= */
function calculateNoticePrice(qty, job, sizeText, variantText) {

    qty = parseFloat(qty) || 0;
    job = parseFloat(job) || 1;
    sizeText = (sizeText || "").toLowerCase();
    variantText = (variantText || "").toLowerCase();

    let isLegal = sizeText.includes("legal") || sizeText.includes("lgl");
    let isA5 = sizeText.includes("a5");

    let paperRate = isLegal ? 0.60 : (isA5 ? 0.21 : 0.42); // A4 default

    let paperCost = Math.round(qty * paperRate * 100) / 100;

    let baseDesignCharge = 0;

    if (qty > 0) {
        baseDesignCharge = isLegal ? 200 : (isA5 ? 100 : 150); // A4 default
    }

    function printSlab(q) {
        if (q <= 0) return 0;
        if (q <= 100) return 150;
        if (q <= 200) return 180;
        if (q < 500) return 200;
        return 250; // 500 - 1000
    }

    let fullThousands = Math.floor(qty / 1000);
    let remainder = qty % 1000;

    let printCost = (fullThousands * 250) + printSlab(remainder);
    let designCharge = baseDesignCharge;

    // Double Side: print cost AND design charge both doubled
    if (variantText.includes("double")) {
        printCost = printCost * 2;
        designCharge = designCharge * 2;
    }

    return Math.round((paperCost + designCharge + printCost) * job * 100) / 100;
}

function calculateItemTotal() {

    let qty = parseFloat(qtyInput.value) || 0;

    let price = parseFloat(priceInput.value) || 0;

    let job =
    parseFloat(
        document.getElementById("itemJob").value
    ) || 1;

    let categoryName = "";

    if (categorySelect.selectedIndex >= 0) {

        categoryName =
          categorySelect.options[
            categorySelect.selectedIndex
          ].text.toLowerCase();

    }

    let grossAmount = 0;

    /* FIXED / SLAB ITEMS */
    if (
        categoryName.includes("banner") ||
        categoryName.includes("poster") ||
        categoryName.includes("letter pad") ||
        categoryName.includes("printing") ||
        categoryName.includes("invitation")
    ) {

        grossAmount = price * job;

    }

    /* NOTICE - fully custom JS pricing (flat paper rate + range-based print slab + design) */
    else if (categoryName.includes("notice")) {

        let sizeText = "";
        if (sizeSelect.selectedIndex >= 0) {
            sizeText = sizeSelect.options[sizeSelect.selectedIndex].text.toLowerCase();
        }

        let variantText = "";
        if (variantSelect.selectedIndex >= 0) {
            variantText = variantSelect.options[variantSelect.selectedIndex].text.toLowerCase();
        }

        grossAmount = calculateNoticePrice(qty, job, sizeText, variantText);
        priceInput.value = grossAmount.toFixed(2);
    }

    /* BILL BOOK - fully custom JS pricing (paper + print + design + binding) */
    else if (categoryName.includes("bill book")) {

        let sizeText = "";
        if (sizeSelect.selectedIndex >= 0) {
            sizeText = sizeSelect.options[sizeSelect.selectedIndex].text.toLowerCase();
        }

        let variantText = "";
        if (variantSelect.selectedIndex >= 0) {
            variantText = variantSelect.options[variantSelect.selectedIndex].text.toLowerCase();
        }

        grossAmount = calculateBillBookPrice(qty, job, variantText, sizeText);
        priceInput.value = grossAmount.toFixed(2);
    }

    /* NORMAL ITEMS */
        /* TRAIN TICKET */
    else if (
        categoryName.includes("train ticket")
    ) {

        let sizeText = "";

        if (sizeSelect.selectedIndex >= 0) {

            sizeText =
              sizeSelect.options[
                sizeSelect.selectedIndex
              ].text.toLowerCase();
        }

        let basePrice = 0;

        if (sizeText.includes("minimum")) {

            basePrice = 50;

        } else if (sizeText.includes("thakkal")) {

            basePrice = 75;

        } else if (sizeText.includes("premium")) {

            basePrice = 100;
        }

        grossAmount =
          basePrice + ((qty - 1) * 20);

        priceInput.value =
          basePrice.toFixed(2);
    }
    /* ONLINE APPLICATION */
else if (
    categoryName.includes("online application")
) {

    let sizeText = "";

    if (sizeSelect.selectedIndex >= 0) {

        sizeText =
          sizeSelect.options[
            sizeSelect.selectedIndex
          ].text.toLowerCase();
    }

    if (
        sizeText.includes("patta") ||
        sizeText.includes("chitta") ||
        sizeText.includes("ec")
    ) {

        if (qty <= 3) {

            grossAmount = 20;

        } else {

            grossAmount =
              20 + ((qty - 3) * 5);
        }

        priceInput.value = "20.00";

    } else {

        grossAmount = qty * price * job;
    }
}
/* PRINT OUT */
else if (
    categoryName.includes("print out")
) {

    let sizeText = "";

    if (sizeSelect.selectedIndex >= 0) {

        sizeText =
          sizeSelect.options[
            sizeSelect.selectedIndex
          ].text.toLowerCase();
    }

    let variantText = "";

    if (variantSelect.selectedIndex >= 0) {

        variantText =
          variantSelect.options[
            variantSelect.selectedIndex
          ].text.toLowerCase();
    }

    if (sizeText.includes("sticker")) {

        grossAmount = qty * price * job;

    }

    else {

    let isBlackSingle = variantText.includes("black s");

    let isBlackDouble = variantText.includes("black d");

    let isInkjetSingle = variantText.includes("color inkjet s");

    let isInkjetDouble = variantText.includes("color inkjet d");

    /*
    A4 / LEGAL
    */
    if (
        sizeText.includes("a4") ||
        sizeText.includes("legal")
    ) {

        /* BLACK */
        if (isBlackSingle) {

            if (qty <= 10) {

              grossAmount = 10 + ((qty - 1) * 3);
              priceInput.value = (grossAmount).toFixed(2);
            }

            else if (qty <= 20) {

                grossAmount = 37 + ((qty - 10) * 3);
                priceInput.value = (grossAmount).toFixed(2);

            }

            else {

                grossAmount = qty * price * job;
            }
        } else if (isBlackDouble) {

            if (qty <= 10) {

              grossAmount = 10 + ((qty - 1) * 4);
              priceInput.value = (grossAmount).toFixed(2);
            }

            else if (qty <= 20) {

                grossAmount = 46 + ((qty - 10) * 4);
                priceInput.value = (grossAmount).toFixed(2);

            }

            else {

                grossAmount = qty * price * job;
            }
        }


        /* INKJET */
        else if (isInkjetSingle) {

            if (qty <= 10) {
              grossAmount = 15 + ((qty - 1) * 10);
              priceInput.value = (grossAmount).toFixed(2);
            }

            else {

                grossAmount = qty * price * job;
            }
        }

        else if (isInkjetDouble) {

            if (qty <= 10) {
                grossAmount = 25 + ((qty - 1) * 10);
                priceInput.value = (grossAmount).toFixed(2);
            }

            else {

                grossAmount = qty * price * job;
            }
        }

        /* FALLBACK — e.g. Color Laser S/D or any other unlisted variant */
        else {

            grossAmount = qty * price * job;
        }
    }



    else if (
        sizeText.includes("a3")
    ) {

        if (isBlackSingle) {

            if (qty <= 9) {
                grossAmount = 15 + ((qty - 1) * 7);
                priceInput.value = (grossAmount).toFixed(2);
            }

            else {

                grossAmount = qty * price * job;
            }
        }

        else if (isBlackDouble) {

            if (qty <= 9) {

                grossAmount = 20 + ((qty - 1) * 7);
                priceInput.value = (grossAmount).toFixed(2);
            }

            else {

                grossAmount = qty * price * job;
            }
        }

        else {

            grossAmount = qty * price * job;
        }
    }

    /* FALLBACK — any size other than A4/Legal/A3 (e.g. 12x18) */
    else {

        grossAmount = qty * price * job;
    }

}
}

/* NORMAL ITEMS */
else {

    grossAmount = qty * price * job;
}


    totalInput.value = grossAmount.toFixed(2);

}
