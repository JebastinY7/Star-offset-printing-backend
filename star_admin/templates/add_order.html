{% extends 'base.html' %}

{% block content %}

<div class="addx-page">

  <!-- HEADER -->
  <div class="addx-header">
    <h1>Add New Order</h1>

    <p>
      Create customer work orders with deadline,
      payment and production tracking
    </p>

    <a href="{% url 'orders_page' %}" class="back-orders-btn">
      ← Back to Orders
    </a>
  </div>

  <!-- FORM -->
  <div class="order-form-card addx-form-card">

    <form method="POST">

      {% csrf_token %}

      <!-- TOP DETAILS -->
      <div class="form-grid addx-form-grid">

        <!-- CUSTOMER -->
        <div class="form-group addx-form-group">
          <label>Customer</label>

          <select name="customer" id="customerSelect" required>
            <option value="">Select Customer</option>

            {% for customer in customers %}
            <option value="{{ customer.id }}">
              {{ customer.name }} - {{ customer.phone }}
            </option>
            {% endfor %}
          </select>
        </div>
        
        
        <div class="form-group addx-form-group">
          <label>Work Name</label>
          <input type="text"
                name="work_name"
                placeholder="e.g. Visiting Card, Wedding Notice" required>
        </div>
        </div>

        <div class="addx-form-grids">
        <div class="form-group addx-form-group">
          <label>Status</label>

          <select name="status">
            <option value="pending">Pending</option>
            <option value="progress">In Progress</option>
            <option value="completed">Completed</option>
            <option value="delivered">Delivered</option>
          </select>
        </div>

        <!-- ORDER DATE -->
        <div class="form-group addx-form-group">
          <label>Order Date</label>

          <input type="text"
                 name="order_date"
                 id="orderDate"
                 value="{{ today|date:'Y-m-d' }}"
                 required>
        </div>

        <!-- DELIVERY DATE -->
        <div class="form-group addx-form-group">
          <label>Delivery Date</label>

          <input type="text"
                  id="deliveryDate"
                 name="delivery_date"
                 required>
        </div>
      </div>
      


      <!-- ITEM SECTION -->
      <div class="order-items-card">

        <h2>Items</h2>

<!-- BILLING TYPE -->
<div class="billing-top-row">
  <div>
    <label>Select Billing Type</label>

    <select id="billingType">

        <option value="normal">Normal print</option>

        <option value="digital">Digital print</option>

    </select>
  </div>
  <div id="customerTypeWrapper">
    <label>Customer Type</label>

    <select id="customerType">
      <option value="customer">Customer</option>
      <option value="shop">Shop</option>
    </select>
  </div>
</div>



<!-- NORMAL -->
<div id="normalBillingFields"
     class="items-grid-normal">

    <select id="itemCategory">
        <option value="">
        Select Category
    </option>

    {% for cat in categories %}

    <option value="{{ cat.id }}">
        {{ cat.name }}
    </option>

    {% endfor %}
    </select>

    <select id="itemSize">
        <option value="">Select Size</option>
    </select>

    <select id="itemVariant">
        <option value="">Select Variant</option>
    </select>

    <input type="number"
           id="itemQty"
           placeholder="Qty">

    <input type="number"
       id="itemJob"
       placeholder="Job"
       value="1">

</div>


<!-- DIGITAL -->
<div id="digitalBillingFields"
     class="items-grid-digital"
     style="display:none;">

    <select id="digitalCategory">
        <option value="">
        Select Category
    </option>

    {% for cat in digital_categories %}

    <option value="{{ cat.id }}">
        {{ cat.name }}
    </option>

    {% endfor %}
    </select>

    <select id="digitalGsm">
        <option value="">Select GSM</option>
    </select>

    <select id="digitalProduct">
        <option value="">Select Product</option>
    </select>

    <select id="digitalLamination">
        <option value="">
            Select Lamination
        </option>
    </select>

    <select id="digitalSide">
        <option value="">Select Side</option>
        <option value="single">Single Side</option>
        <option value="double">Double Side</option>
    </select>

    <select id="digitalDeliveryType">
        {% for delivery in delivery_types %}
            <option value="{{ delivery.id }}">
                {{ delivery.name }}
            </option>
        {% endfor %}
    </select>

    <input type="number"
           id="digitalQty"
           placeholder="Qty">

    <input type="number"
       id="digitalJob"
       placeholder="Job"
       value="1">

</div>


<!-- PRICE ROW -->
<div class="price-row">

    <input type="text"
           id="itemPrice"
           placeholder="Price"
           readonly>

    <input type="text"
           id="itemTotal"
           placeholder="Total"
           readonly>

    <button type="button"
            class="add-item-btn"
            onclick="addOrderItem()">

        Add
    </button>

</div>


        <!-- TABLE -->
        <table class="order-items-table">

          <thead>
            <tr>
              <th>Item</th>
              <th>Qty</th>
              <th>Job</th>
              <th>Price</th>
              <th>Total</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="orderItemsBody">
          </tbody>

        </table>

      </div>


      <!-- PAYMENT SUMMARY -->
      <div class="payment-summary-card">

        <div class="summary-grid">

          <!-- GROSS -->
          <div class="form-group addx-form-group">
            <label>Gross Total</label>

            <input type="text"
                   id="grossTotal"
                   name="total_amount"
                   readonly
                   value="0.00">
          </div>

          <!-- ADVANCE -->
          <div class="form-group addx-form-group">
            <label>Advance Paid</label>

            <input type="number"
                   step="0.01"
                   id="advancePaid"
                   name="advance_paid"
                   value="0"
                   oninput="calculateDue()">
          </div>

          <!-- DUE -->
          <div class="form-group addx-form-group">
            <label>Due Amount</label>

            <input type="text"
                   id="dueAmount"
                   readonly
                   value="0.00">
          </div>
          <!-- NOTES -->
        <div class="form-group addx-form-group addx-full">
          <label>Description / Notes</label>

          <textarea name="notes"
            placeholder="Paper type, urgent work, design notes, printing details..."></textarea>
        </div>

        </div>

      </div>


      <!-- SAVE -->
      <div class="addx-btn-row">

        <button type="submit"
                class="addx-save-btn">

          Save Order
        </button>

        <a href="{% url 'orders_page' %}"
           class="addx-cancel-btn">

          Cancel
        </a>

      </div>

    </form>

  </div>

</div>



<script>

let orderItems = [];
let editIndex = -1;




/* ADD ITEM */
function addOrderItem() {

    const isDigital =
      billingType.value === "digital";

    let category, size, variant, qty, lamination;
    let job = 1;
let digitalJob = 1;

    /* NORMAL */
    if (!isDigital) {

        category =
          document.getElementById("itemCategory");

        size =
          document.getElementById("itemSize");

        variant =
          document.getElementById("itemVariant");

        qty =
          parseFloat(
            document.getElementById("itemQty").value
          ) || 0;
        
        job =
    parseFloat(
        document.getElementById("itemJob").value
    ) || 1;
    }

    /* DIGITAL */
    else {

        category =
          document.getElementById("digitalCategory");

        size =
          document.getElementById("digitalGsm");

        variant =
          document.getElementById("digitalProduct");

        lamination =
          document.getElementById("digitalLamination");

        qty =
          parseFloat(
            document.getElementById("digitalQty").value
          ) || 0;

          digitalJob =
    parseFloat(
        document.getElementById("digitalJob").value
    ) || 1;
    }

    let price =
      parseFloat(
        document.getElementById("itemPrice").value
      ) || 0;

    let total =
      parseFloat(
        document.getElementById("itemTotal").value
      ) || 0;

    if (
        !category.value ||
        !size.value ||
        !variant.value ||
        qty <= 0
    ) {

        showToast("Fill all item fields");
        return;
    }

    let itemData = {

        category_id: category.value,
        category:
          category.options[
            category.selectedIndex
          ].text,

        size_id: size.value,
        size:
          size.options[
            size.selectedIndex
          ].text,

        variant_id: variant.value,
        variant:
          variant.options[
            variant.selectedIndex
          ].text,

        lamination_id:
            isDigital ? lamination.value : "",

        lamination:
            isDigital
            ? lamination.options[
                lamination.selectedIndex
              ].text
            : "",

        side:
    document.getElementById("digitalSide").value,

side_name:
    document.getElementById("digitalSide")
        .options[
            document.getElementById("digitalSide").selectedIndex
        ].text,

        delivery_type:
        document.getElementById("digitalDeliveryType").value,

        delivery_name:
        document.getElementById("digitalDeliveryType")
        .options[
        document.getElementById("digitalDeliveryType").selectedIndex
        ].text,

        qty: qty,
        job: isDigital ? digitalJob : job,
        price: price,
        total: total,

        billing_type:
          isDigital ? "digital" : "normal"
    };

    orderItems.push(itemData);

    renderItems();

    clearItemFields();
}



/* RENDER ITEMS */
function renderItems() {

    let tbody =
      document.getElementById("orderItemsBody");

    tbody.innerHTML = "";

    let gross = 0;

    orderItems.forEach((item, index) => {

        gross += item.total;

        tbody.innerHTML += `
        <tr>

          <td>
            ${item.category}
            -
            ${item.size}
            -
            ${item.variant}
            ${item.lamination ? " - " + item.lamination : ""}
            ${item.side_name ? "- " + item.side_name : ""}
            <input type="hidden" name="item_category[]" value="${item.category_id}">
            <input type="hidden" name="item_size[]" value="${item.size_id}">
            <input type="hidden" name="item_variant[]" value="${item.variant_id}">
            <input type="hidden" name="item_qty[]" value="${item.qty}">
            <input type="hidden" name="item_price[]" value="${item.price}">
            <input type="hidden" name="item_total[]" value="${item.total}">
            <input type="hidden" name="billing_type[]" value="${item.billing_type}">
            <input type="hidden" name="item_side[]" value="${item.side || ''}">
            <input type="hidden" name="item_side_name[]" value="${item.side_name || ''}">
            <input type="hidden" name="item_job[]" value="${item.job}">
            <input type="hidden" name="item_lamination[]" value="${item.lamination_id || ''}">
            <input type="hidden" name="item_delivery_type[]" value="${item.delivery_type || ''}">
          </td>

          <td>${item.qty}</td>

          <td>${item.job || 1}</td>

          <td>₹${item.price.toFixed(2)}</td>

          <td>₹${item.total.toFixed(2)}</td>

          <td>
          <div class="action-btns">
          <div class="tooltip">
          <button type="button"
            onclick="editItem(${index})">
            ✏️
        </button>
        <span class="tooltip-text">Edit</span>
        </div>
              
              <div class="tooltip">
                <button type="button"
                    onclick="removeItem(${index})">X</button>
                    <span class="tooltip-text">Remove</span>
              </div>
           </div>
          </td>

        </tr>
        `;
    });

    document.getElementById("grossTotal").value =
      gross.toFixed(2);

    calculateDue();
}




/* REMOVE ITEM */
function removeItem(index) {

    orderItems.splice(index, 1);

    renderItems();
}


function editItem(index) {

    let item = orderItems[index];

    orderItems.splice(index, 1);

    renderItems();

    document.querySelector(".add-item-btn").innerText =
      "Update";

    /* DIGITAL */
    if (item.billing_type === "digital") {

    billingType.value = "digital";

    updateBillingView();

    document.getElementById("digitalCategory").value =
      item.category_id;

    document.getElementById("digitalSide").value =
      item.side;

    document.getElementById("digitalDeliveryType").value =
        item.delivery_type;

      document.getElementById("digitalJob").value =
  item.job || 1;

    fetch(`/get-digital-gsm/?category_id=${item.category_id}`)

    .then(res => res.json())

    .then(data => {

        digitalGsm.innerHTML =
          '<option value="">Select GSM</option>';

        data.gsms.forEach(gsm => {

            digitalGsm.innerHTML += `
                <option value="${gsm.id}">
                    ${gsm.name}
                </option>
            `;
        });

        document.getElementById("digitalGsm").value =
          item.size_id;

        return fetch(
          `/get-digital-products/?gsm_id=${item.size_id}&side=${item.side}`
        );
    })

    .then(res => res.json())

    .then(data => {

        digitalProduct.innerHTML =
          '<option value="">Select Product</option>';

        data.products.forEach(product => {

            digitalProduct.innerHTML += `
                <option value="${product.id}">
                    ${product.name}
                </option>
            `;
        });

        /* IMPORTANT */
        setTimeout(() => {

            document.getElementById("digitalProduct").value =
              item.variant_id;

        }, 100);

        document.getElementById("digitalQty").value =
          item.qty;

          document.getElementById("itemJob").value =
  item.job || 1;

        document.getElementById("itemPrice").value =
          item.price;

        document.getElementById("itemTotal").value =
          item.total;

 });
}

/* NORMAL */
else {

    billingType.value = "normal";

    updateBillingView();

    document.getElementById("itemCategory").value =
      item.category_id;

    document.getElementById("itemJob").value =
      item.job || 1;

    fetch(`/get-sizes/?category_id=${item.category_id}`)

    .then(res => res.json())

    .then(data => {

        itemSize.innerHTML =
          '<option value="">Select Size</option>';

        data.sizes.forEach(size => {

            itemSize.innerHTML += `
                <option value="${size.id}">
                    ${size.name}
                </option>
            `;
        });

        document.getElementById("itemSize").value =
          item.size_id;

        return fetch(
          `/get-variants/?size_id=${item.size_id}`
        );

    })

    .then(res => res.json())

    .then(data => {

        itemVariant.innerHTML =
          '<option value="">Select Variant</option>';

        data.variants.forEach(variant => {

            itemVariant.innerHTML += `
                <option value="${variant.id}">
                    ${variant.name}
                </option>
            `;
        });

        setTimeout(() => {

            document.getElementById("itemVariant").value =
              item.variant_id;

        }, 100);

        document.getElementById("itemQty").value =
          item.qty;

        document.getElementById("itemPrice").value =
          item.price;

        document.getElementById("itemTotal").value =
          item.total;

    });

}
}



/* DUE */
function calculateDue() {

    let gross =
      parseFloat(document.getElementById("grossTotal").value) || 0;

    let advance =
      parseFloat(document.getElementById("advancePaid").value) || 0;

    

    let due = gross - advance;

    if (due < 0) {
        due = 0;
    }


    document.getElementById("dueAmount").value =
      due.toFixed(2);
}


const categorySelect = document.getElementById("itemCategory");
const sizeSelect = document.getElementById("itemSize");
const variantSelect = document.getElementById("itemVariant");

categorySelect.addEventListener("change", function () {

    const categoryId = this.value;

    fetch(`/get-sizes/?category_id=${categoryId}`)
        .then(response => response.json())
        .then(data => {

            sizeSelect.innerHTML =
                '<option value="">Select Size</option>';

            data.sizes.forEach(size => {

                sizeSelect.innerHTML += `
                    <option value="${size.id}">
                        ${size.name}
                    </option>
                `;
            });
        });

});

sizeSelect.addEventListener("change", function () {

    const sizeId = this.value;

    fetch(`/get-variants/?size_id=${sizeId}`)
        .then(response => response.json())
        .then(data => {

            variantSelect.innerHTML =
                '<option value="">Select Variant</option>';

            data.variants.forEach(variant => {

                variantSelect.innerHTML += `
                    <option value="${variant.id}">
                        ${variant.name}
                    </option>
                `;
            });

        });

});

const priceInput = document.getElementById("itemPrice");
const qtyInput = document.getElementById("itemQty");
const totalInput = document.getElementById("itemTotal");

/* =========================
   DIGITAL PRINT
========================= */

const billingType =
document.getElementById("billingType");

const normalFields =
document.getElementById("normalBillingFields");

const digitalFields =
document.getElementById("digitalBillingFields");

/* DIGITAL SELECTS */
const digitalCategory =
document.getElementById("digitalCategory");

const digitalGsm =
document.getElementById("digitalGsm");

const digitalProduct =
document.getElementById("digitalProduct");

const digitalDelivery =
document.getElementById("digitalDeliveryType");

const digitalQty =
document.getElementById("digitalQty");

const customerTypeWrapper =
document.getElementById("customerTypeWrapper");


/* TOGGLE */
function updateBillingView() {

    // Clear all previous values
    clearItemFields();

    if (billingType.value === "digital") {

        normalFields.style.display = "none";
        digitalFields.style.display = "grid";
        customerTypeWrapper.style.display = "block";

    }

    else {

        normalFields.style.display = "grid";
        digitalFields.style.display = "none";
        customerTypeWrapper.style.display = "none";

    }
}


/* RUN ON CHANGE */
billingType.addEventListener(
    "change",
    updateBillingView
);


/* RUN ON PAGE LOAD */
updateBillingView();


/* CATEGORY -> GSM */
digitalCategory.addEventListener("change", function () {

    fetch(`/get-digital-gsm/?category_id=${this.value}`)

    .then(res => res.json())

    .then(data => {

        digitalGsm.innerHTML =
          '<option value="">Select GSM</option>';

        data.gsms.forEach(gsm => {

            digitalGsm.innerHTML += `
                <option value="${gsm.id}">
                    ${gsm.name}
                </option>
            `;
        });

    });

});

const digitalLamination =
document.getElementById("digitalLamination");

const digitalSide =
document.getElementById("digitalSide");


function loadDigitalProducts() {

    let gsmId = digitalGsm.value;

    if (!gsmId) return;

    fetch(`/get-digital-products/?gsm_id=${gsmId}`)

    .then(res => res.json())

    .then(data => {

        digitalProduct.innerHTML =
            '<option value="">Select Product</option>';

        data.products.forEach(product => {

            digitalProduct.innerHTML += `
                <option value="${product.id}">
                    ${product.name}
                </option>
            `;
        });

    });

}

digitalProduct.addEventListener("change", function () {

    fetch(`/get-digital-laminations/?product_id=${this.value}`)

    .then(res => res.json())

    .then(data => {

        digitalLamination.innerHTML =
            '<option value="">Select Lamination</option>';

        data.laminations.forEach(lamination => {

            digitalLamination.innerHTML += `
                <option value="${lamination.id}">
                    ${lamination.name}
                </option>
            `;

        });

        // Automatically select the first lamination
        if (data.laminations.length > 0) {
            digitalLamination.value = data.laminations[0].id;
            fetchDigitalPrice();
        }

    });

});

digitalGsm.addEventListener(
    "change",
    loadDigitalProducts
);



digitalSide.addEventListener(
    "change",
    fetchDigitalPrice
);


/* FETCH DIGITAL PRICE */
function fetchDigitalPrice() {

    console.log("fetchDigitalPrice called");

    const laminationId =
      digitalLamination.value;

    const qty =
      digitalQty.value;

    const deliveryType =
digitalDelivery.value;

console.log({
        laminationId,
        side: digitalSide.value,
        deliveryType,
        qty
    });
    
    const digitalJob =
    parseFloat(
        document.getElementById("digitalJob").value
    ) || 1;

    const customerType =
      document.getElementById("customerType").value;

    if (!laminationId || !qty) {
        return;
    }

    fetch(`/get-digital-price/?lamination_id=${laminationId}&side=${digitalSide.value}&delivery_type=${deliveryType}&qty=${qty}`)

    .then(res => res.json())

    .then(data => {

        if (!data.success) {

            document.getElementById("itemPrice").value = "";
            document.getElementById("itemTotal").value = "";

            return;
        }

        let finalPrice =
            customerType === "shop"
            ?
            parseFloat(data.shop_rate)
            :
            parseFloat(data.customer_rate);

        document.getElementById("itemPrice").value =
          finalPrice.toFixed(2);

        document.getElementById("itemTotal").value =
  (finalPrice * digitalJob).toFixed(2);

    });

}


/* EVENTS */
digitalProduct.addEventListener(
    "change",
    fetchDigitalPrice
);

digitalQty.addEventListener(
    "input",
    fetchDigitalPrice
);



digitalDelivery.addEventListener(
    "change",
    fetchDigitalPrice
);

document.getElementById("customerType")
.addEventListener(
    "change",
    fetchDigitalPrice
);

function fetchPrice() {

    const categoryId = categorySelect.value;
    const sizeId = sizeSelect.value;
    const variantId = variantSelect.value;
    const qty = qtyInput.value || 1;

    console.log(categoryId, sizeId, variantId, qty);
    if (!categoryId || !sizeId || !variantId) {
        return;
    }

    fetch(
      `/get-order-price/?category_id=${categoryId}&size_id=${sizeId}&variant_id=${variantId}&qty=${qty}`
    )
    .then(response => response.json())
    .then(data => {

        priceInput.value = data.price || 0;

        calculateItemTotal();

    });

}

digitalLamination.addEventListener(
    "change",
    fetchDigitalPrice
);

variantSelect.addEventListener(
    "change",
    fetchPrice
);

qtyInput.addEventListener(
    "input",
    fetchPrice
);

document.getElementById("itemJob")
.addEventListener(
    "input",
    calculateItemTotal
);

document.getElementById("digitalJob")
.addEventListener(
    "input",
    fetchDigitalPrice
);

sizeSelect.addEventListener(
    "change",
    fetchPrice
);

categorySelect.addEventListener("change", function () {

    document.getElementById("itemPrice").value = "";
    document.getElementById("itemTotal").value = "";
});

function calculateItemTotal() {

    let qty = parseFloat(qtyInput.value) || 0;

    let price = parseFloat(priceInput.value) || 0;

    let job =
    parseFloat(
        document.getElementById("itemJob").value
    ) || 1;

    let categoryName = "";

    if (categorySelect.selectedIndex >= 0) {

        categoryName =
          categorySelect.options[
            categorySelect.selectedIndex
          ].text.toLowerCase();

    }

    let grossAmount = 0;

    /* FIXED / SLAB ITEMS */
    if (
        categoryName.includes("notice") ||
        categoryName.includes("banner") ||
        categoryName.includes("bill book") ||
        categoryName.includes("poster") ||
        categoryName.includes("letter pad") ||
        categoryName.includes("printing") ||
        categoryName.includes("invitation")
    ) {

        grossAmount = price * job;

    }

    /* NORMAL ITEMS */
        /* TRAIN TICKET */
    else if (
        categoryName.includes("train ticket")
    ) {

        let sizeText = "";

        if (sizeSelect.selectedIndex >= 0) {

            sizeText =
              sizeSelect.options[
                sizeSelect.selectedIndex
              ].text.toLowerCase();
        }

        let basePrice = 0;

        if (sizeText.includes("minimum")) {

            basePrice = 50;

        } else if (sizeText.includes("thakkal")) {

            basePrice = 75;

        } else if (sizeText.includes("premium")) {

            basePrice = 100;
        }

        grossAmount =
          basePrice + ((qty - 1) * 20);

        priceInput.value =
          basePrice.toFixed(2);
    }
    /* ONLINE APPLICATION */
else if (
    categoryName.includes("online application")
) {

    let sizeText = "";

    if (sizeSelect.selectedIndex >= 0) {

        sizeText =
          sizeSelect.options[
            sizeSelect.selectedIndex
          ].text.toLowerCase();
    }

    if (
        sizeText.includes("patta") ||
        sizeText.includes("chitta") ||
        sizeText.includes("ec")
    ) {

        if (qty <= 3) {

            grossAmount = 20;

        } else {

            grossAmount =
              20 + ((qty - 3) * 5);
        }

        priceInput.value = "20.00";

    } else {

        grossAmount = qty * price * job;
    }
}
/* PRINT OUT */
else if (
    categoryName.includes("print out")
) {

    let sizeText = "";

    if (sizeSelect.selectedIndex >= 0) {

        sizeText =
          sizeSelect.options[
            sizeSelect.selectedIndex
          ].text.toLowerCase();
    }

    let variantText = "";

    if (variantSelect.selectedIndex >= 0) {

        variantText =
          variantSelect.options[
            variantSelect.selectedIndex
          ].text.toLowerCase();
    }

    if (sizeText.includes("sticker")) {

        grossAmount = qty * price * job;

    }

    else {

    let isBlackSingle = variantText.includes("black s");

    let isBlackDouble = variantText.includes("black d");

    let isInkjetSingle = variantText.includes("color inkjet s");

    let isInkjetDouble = variantText.includes("color inkjet d");

    /*
    A4 / LEGAL
    */
    if (
        sizeText.includes("a4") ||
        sizeText.includes("legal")
    ) {

        /* BLACK */
        if (
            isBlackSingle ||
            isBlackDouble
        ) {

            if (qty <= 10) {

              grossAmount = 10 + ((qty - 1) * 3);
              priceInput.value = (grossAmount).toFixed(2);
            }

            else if (qty <= 20) {

                grossAmount = 37 + ((qty - 10) * 3) - 5;
                priceInput.value = (grossAmount).toFixed(2);

            }

            else {

                grossAmount = qty * price * job;
            }
        }

        /* INKJET */
        else if (isInkjetSingle) {

            if (qty <= 10) {
              grossAmount = 15 + ((qty - 1) * 10);
              priceInput.value = (grossAmount).toFixed(2);
            }

            else {

                grossAmount = qty * price * job;
            }
        }

        else if (isInkjetDouble) {

            if (qty <= 10) {
                grossAmount = 25 + ((qty - 1) * 10);
                priceInput.value = (grossAmount).toFixed(2);
            }

            else {

                grossAmount = qty * price * job;
            }
        }
    }


    else if (
        sizeText.includes("a3")
    ) {

        if (isBlackSingle) {

            if (qty <= 9) {
                grossAmount = 15 + ((qty - 1) * 7);
                priceInput.value = (grossAmount).toFixed(2);
            }

            else {

                grossAmount = qty * price * job;
            }
        }

        else if (isBlackDouble) {

            if (qty <= 9) {

                grossAmount = 20 + ((qty - 1) * 7);
                priceInput.value = (grossAmount).toFixed(2);
            }

            else {

                grossAmount = qty * price * job;
            }
        }
        else {

    grossAmount = qty * price * job;
  }
    }
    else {

    grossAmount = qty * price * job;
}

}
}

/* NORMAL ITEMS */
else {

    grossAmount = qty * price * job;
}


    totalInput.value = grossAmount.toFixed(2);

}

function clearItemFields() {

    // ---------- NORMAL ----------
    document.getElementById("itemCategory").value = "";
    document.getElementById("itemSize").innerHTML =
        '<option value="">Select Size</option>';

    document.getElementById("itemVariant").innerHTML =
        '<option value="">Select Variant</option>';

    document.getElementById("itemQty").value = "";
    document.getElementById("itemJob").value = 1;

    // ---------- DIGITAL ----------
    document.getElementById("digitalCategory").value = "";

    document.getElementById("digitalGsm").innerHTML =
        '<option value="">Select GSM</option>';

    document.getElementById("digitalProduct").innerHTML =
        '<option value="">Select Product</option>';

    document.getElementById("digitalLamination").innerHTML =
        '<option value="">Select Lamination</option>';

    document.getElementById("digitalSide").value = "";

    document.getElementById("digitalDeliveryType").selectedIndex = 0;

    document.getElementById("digitalQty").value = "";

    document.getElementById("digitalJob").value = 1;

    // ---------- COMMON ----------
    document.getElementById("itemPrice").value = "";

    document.getElementById("itemTotal").value = "";
}
